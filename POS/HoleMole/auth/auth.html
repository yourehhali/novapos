<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <div class="left-side">
            <div class="logo-container">
                <div class="logo"><img src="logo-orange.png" alt=""></div>
                <div class="text">
                    <h1>HOLE MOLE</h1>
                    <p>Proffessional POS System</p>
                </div>
            </div>
            <div class="middle-container">
                <h2>
                    BONJOUR,
                </h2>
                <div class="time">
                    06:54:57
                </div>
                <span class="divider">

                </span>
                <div class="date">
                    Mercredi 18 Mars 2026
                </div>
            </div>
            <div class="bottom-container">

            </div>
        </div>
        <div class="right-side">
            <div class="input-status">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="grid-input-container">
                <div class="digit">1</div>
                <div class="digit">2</div>
                <div class="digit">3</div>
                <div class="digit">4</div>
                <div class="digit">5</div>
                <div class="digit">6</div>
                <div class="digit">7</div>
                <div class="digit">8</div>
                <div class="digit">9</div>
                <div class="delete"><i data-lucide="delete"></i></div>
                <div class="digit">0</div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
