name: Build Desktop Apps
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'appfront/**'
      - '.github/workflows/desktop-build.yml'
jobs:
  build-windows:
    name: Build Windows EXE (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - ia32
          - x64
    defaults:
      run:
        working-directory: appfront
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appfront/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build renderer and main process
        run: npm run desktop:build
      - name: Package Windows desktop app (${{ matrix.arch }})
        run: npx electron-builder --publish never --win nsis portable --${{ matrix.arch }}
      - name: Upload Windows artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: RoxPos-desktop-windows-${{ matrix.arch }}
          path: appfront/release/*.exe
          if-no-files-found: error
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: appfront
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appfront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Package macOS desktop app
        run: npm run desktop:package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoxPos-desktop-macos
          path: appfront/release/**
          if-no-files-found: error
