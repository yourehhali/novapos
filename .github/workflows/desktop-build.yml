name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'appfront/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: appfront

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appfront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run desktop:build

      - name: Package Windows 32-bit (ia32)
        run: npx electron-builder --publish never --win nsis portable --ia32 -c.directories.output=release/win-ia32

      - name: Package Windows 64-bit (x64)
        run: npx electron-builder --publish never --win nsis portable --x64 -c.directories.output=release/win-x64

      - name: Upload Windows 32-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoxPos-desktop-windows-ia32
          path: appfront/release/win-ia32/*.exe
          if-no-files-found: error

      - name: Upload Windows 64-bit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoxPos-desktop-windows-x64
          path: appfront/release/win-x64/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: appfront

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appfront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Package macOS desktop app
        run: npm run desktop:package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoxPos-desktop-macos
          path: appfront/release/**
          if-no-files-found: error
