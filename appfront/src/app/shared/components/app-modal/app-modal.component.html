<div class="modal-backdrop" *ngIf="modal.currentModal() as current" (click)="close()">
  <section
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="app-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-header">
      <div>
        <p class="eyebrow">Erreur d impression</p>
        <h2 id="app-modal-title">{{ current.title }}</h2>
      </div>
      <button type="button" class="close-button" (click)="close()" aria-label="Fermer">Fermer</button>
    </header>

    <div class="modal-body">
      <p>{{ current.message }}</p>
      <pre *ngIf="current.details">{{ current.details }}</pre>
    </div>

    <footer class="modal-footer">
      <button type="button" class="primary-button" (click)="close()">Compris</button>
    </footer>
  </section>
</div>
